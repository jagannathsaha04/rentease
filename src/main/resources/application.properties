spring.application.name=rentease

# H2 in-memory database (Spring Boot auto-configures the DataSource from these values)
spring.datasource.url=jdbc:h2:mem:renteasedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates the tables from the @Entity classes and drops them on shutdown
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# H2 web console -> http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
